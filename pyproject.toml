[project]
name = "iaps-i"
version = "0.1.0"
description = "Master's coursework: notebooks plus the malware-classification Streamlit workbench in learn/"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

dependencies = [
    # Core numerics and data
    "numpy>=2.5.2",
    "pandas>=2.3.0",
    "polars>=1.44.0",
    "pyarrow>=21.0.0",
    "pydantic>=2.5.0",
    # Classical ML
    "scikit-learn>=1.9.0",
    "scikit-image>=0.25.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.1.0",
    "optuna>=3.4.0",
    "umap-learn>=0.5.7",
    # Deep learning
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "torch-geometric>=2.4.0",
    "transformers>=4.35.0",
    "datasets>=2.14.0",
    # Streamlit app
    "streamlit>=1.62.0",
    "watchdog>=6.0.0",
    "anywidget>=0.8.0",
    "pillow>=11.0.0",
    "psutil>=6.0.0",
    # Visualization
    "matplotlib>=3.11.1",
    "plotly>=7.0.0",
    "seaborn>=0.13.2",
    # Notebooks (and the upcoming workflow-to-notebook export)
    "ipykernel>=7.3.0",
    "jupyter>=1.1.0",
    "nbformat>=5.10.0",
    # Utilities
    "requests>=2.32.0",
    "kaggle>=1.5.16",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "typer>=0.9.0",
    "rich>=13.6.0",
    "imbalanced-learn>=0.14.2",
    "mesa>=3.5.1",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
    "black>=23.9.0",
    "pre-commit>=3.5.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
# learn/app is added to sys.path by Streamlit, so its packages are top-level imports
known-first-party = [
    "components",
    "config",
    "constants",
    "content",
    "models",
    "state",
    "training",
    "utils",
]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.black]
line-length = 88
target-version = ['py313']

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
